<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — AI CORAL</title><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-page"><div class="auth-glow"></div><section class="auth-card"><div class="brand-row auth-brand"><div class="brand-mark">✳</div><div class="brand-name">AI <span>CORAL</span></div></div><div class="auth-orb">✳</div><h1 id="heading">Your ideas, in full color.</h1><p id="intro">Sign in or create your account using a secure email code.</p><form id="login-form"><label for="email" style="display:block;text-align:left;color:#aaa;font-size:12px">Email address</label><input id="email" type="email" autocomplete="username webauthn" required placeholder="you@example.com" style="width:100%;padding:13px;margin:8px 0 12px;background:#101014;border:1px solid #3a3a43;border-radius:10px;color:white"><div id="code-wrap" class="hide"><label for="code" style="display:block;text-align:left;color:#aaa;font-size:12px">6-digit verification code</label><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="123456" style="width:100%;padding:13px;margin:8px 0 12px;background:#101014;border:1px solid #3a3a43;border-radius:10px;color:white"></div><div id="error" style="color:#ff9fa7;text-align:left;font-size:12px;margin:8px 0"></div><button id="submit" class="auth-primary" type="submit">Continue with email →</button></form><div class="auth-security">◇ Secure passwordless sign-in</div><div class="auth-foot">By continuing, you agree to use AI CORAL responsibly.</div></section></main><script>
const A=window.hatchable?.auth,form=document.getElementById('login-form'),email=document.getElementById('email'),code=document.getElementById('code'),wrap=document.getElementById('code-wrap'),error=document.getElementById('error'),submit=document.getElementById('submit');let step='email';const next=new URLSearchParams(location.search).get('next');function go(){location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/'};(async()=>{try{if((await A?.getSession())?.user)go()}catch{}})();form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';submit.disabled=true;try{if(!A)throw Error('Sign-in service is unavailable. Reload and try again.');if(step==='email'){await A.startLogin({email:email.value.trim()});step='code';wrap.classList.remove('hide');document.getElementById('heading').textContent='Check your inbox';document.getElementById('intro').textContent='Enter the six-digit code we emailed to you.';submit.textContent='Verify and sign in';code.required=true;code.focus()}else{await A.verifyCode({email:email.value.trim(),code:code.value.trim()});go()}}catch(err){error.textContent=err.message||'Unable to sign in. Please try again.'}finally{submit.disabled=false}});</script></body></html>
